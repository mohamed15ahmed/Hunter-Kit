name: Verify HunterKit
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Hunter Kit
    steps:
      - uses: actions/checkout@v4
        with:
          path: Hunter Kit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Hunter Kit/package-lock.json
      - run: npm run setup
      - run: npm run build
      - name: Verify on Windows with installed Edge
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $browser = @("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { Write-Output '::error::Edge was not found on the Windows runner.'; exit 1 }
          $env:HUNTERKIT_TEST_BROWSER = $browser
          node tests/run-ci.mjs
          exit $LASTEXITCODE
      - name: Verify on Linux
        if: runner.os == 'Linux'
        run: npm test
